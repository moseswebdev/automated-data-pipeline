version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: retail_data_pipeline_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-data_pipeline}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/ingestion/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./src/cleaning/cleaned_schema.sql:/docker-entrypoint-initdb.d/02_cleaned_schema.sql
volumes:
  postgres_data:
